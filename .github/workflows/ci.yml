name: CI

on:
  push:
    branches: [main]
  pull_request:

# bot 徽章/报告提交需要写权限（显式声明，防仓库默认权限漂移）
permissions:
  contents: write

jobs:
  # PR 快速反馈：冒烟层（核心安全路径，~1s）先行，不阻塞于全量矩阵
  pr-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke layer (core safety paths)
        run: python -m pytest tests/ -m smoke -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check tcms tests demo.py run.py scripts
      - name: Check formatting with ruff
        run: ruff format --check tcms tests demo.py run.py scripts

  test:
    runs-on: ubuntu-latest
    needs: [pr-smoke, lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full regression (coverage gate)
        run: python -m pytest tests/ -v --tb=short --html=report.html --self-contained-html --junitxml=reports/junit-py${{ matrix.python-version }}.xml --cov=tcms --cov-report=term --cov-report=json --cov-fail-under=97
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.html
      - name: Upload JUnit XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit-py${{ matrix.python-version }}.xml
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.json
      # main 分支：用 3.12 真实产物自证 README 徽章（防手抄漂移）
      - name: Self-prove README badges
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12' && github.event_name != 'pull_request'
        run: |
          python scripts/gen_badges.py --junit reports/junit-py3.12.xml --coverage-json coverage.json
      - name: Commit self-proven badges
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            # [skip ci]：徽章自证提交不重新触发 CI（防递归循环）
            git commit -m "docs: 徽章数字自证（CI 产物） [skip ci]"
            # 并发 main push 竞态：非快进则 rebase 后重推一次
            git pull --rebase origin main || true
            git push
          }

  demo-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke demo.py
        run: PYTHONIOENCODING=utf-8 python demo.py
      - name: Smoke examples replay chain
        run: |
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py --report
      - name: Render trend report from junit
        run: |
          python -m pytest tests/ -m smoke -q --junitxml=reports/junit-smoke.xml
          python scripts/report_history.py --ascii
          python scripts/report_history.py -o reports/TREND.md
      - name: Upload trend report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trend-report
          path: reports/TREND.md
      - name: Smoke plot_timeline.py
        run: PYTHONIOENCODING=utf-8 python scripts/plot_timeline.py
      - name: Upload timeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline-demo
          path: docs/timeline_demo.png

  # main 分支：同 run 下载 3.12 产物 → 渲染 docs/reports/（实时报告）→ 提交回仓库，
  # 由 pages.yml 部署。跨 workflow 下载产物不可行（download-artifact 只读当前 run），
  # 故渲染放在 CI 内、Pages 只做纯部署。
  deploy-pages:
    runs-on: ubuntu-latest
    needs: [test, demo-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download 3.12 JUnit
        uses: actions/download-artifact@v4
        with:
          name: junit-py3.12
          path: reports/
      - name: Download 3.12 coverage JSON
        uses: actions/download-artifact@v4
        with:
          name: coverage-py3.12
          path: reports/
      - name: Download 3.12 HTML report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report-py3.12
          path: reports/
      - name: Render docs/reports/ (trend + latest.json + html)
        run: |
          mkdir -p docs/reports
          ls reports/
          # 3.12 全量 JUnit 入历史（与 smoke 历史分开命名，避免覆盖）
          cp reports/junit-py3.12.xml reports/junit-master.xml
          python scripts/report_history.py --dir reports --pattern 'junit-master.xml' -o docs/reports/TREND.md
          python scripts/report_history.py --ascii --dir reports --pattern 'junit-master.xml' -o docs/reports/TREND.txt
          cp reports/report.html docs/reports/report.html
          python - <<'EOF'
          import json, pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path("reports/junit-py3.12.xml")
          root = ET.parse(p).getroot()
          suite = root if root.tag == "testsuite" else next(iter(root))
          cov = json.loads(pathlib.Path("reports/coverage.json").read_text(encoding="utf-8"))
          data = {
              "tests": int(suite.attrib.get("tests", 0)),
              "skipped": int(suite.attrib.get("skipped", 0)),
              "coverage": round(cov["totals"]["percent_covered"], 2),
              "python": "3.12",
              "run_count": 1,
          }
          pathlib.Path("docs/reports/latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("latest.json:", data)
          EOF
      - name: Commit rendered reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet docs/reports/ || {
            git add docs/reports/
            # [skip ci]：报告提交不重新触发 CI（防递归循环）
            git commit -m "docs: 实时测试报告刷新（CI 产物） [skip ci]"
            # 并发 main push 竞态：非快进则 rebase 后重推一次
            git pull --rebase origin main || true
            git push
          }

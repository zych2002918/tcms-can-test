name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PR 快速反馈：冒烟层（核心安全路径，~1s）先行，不阻塞于全量矩阵
  pr-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke layer (core safety paths)
        run: python -m pytest tests/ -m smoke -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check tcms tests demo.py run.py scripts
      - name: Check formatting with ruff
        run: ruff format --check tcms tests demo.py run.py scripts

  test:
    runs-on: ubuntu-latest
    needs: [pr-smoke, lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full regression (coverage gate)
        run: python -m pytest tests/ -v --tb=short --html=report.html --self-contained-html --junitxml=reports/junit.xml --cov=tcms --cov-report=term --cov-fail-under=97
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.html
      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml

  demo-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke demo.py
        run: PYTHONIOENCODING=utf-8 python demo.py
      - name: Smoke examples replay chain
        run: |
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py
          PYTHONIOENCODING=utf-8 python examples/replay_demo.py --report
      - name: Render trend report from junit
        run: |
          python -m pytest tests/ -m smoke -q --junitxml=reports/junit-smoke.xml
          python scripts/report_history.py --ascii
          python scripts/report_history.py -o reports/TREND.md
      - name: Upload trend report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-report
          path: reports/TREND.md
      - name: Smoke plot_timeline.py
        run: PYTHONIOENCODING=utf-8 python scripts/plot_timeline.py
      - name: Upload timeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeline-demo
          path: docs/timeline_demo.png

name: Release

# 打 tag 即发布：v* tag 触发后全量回归 + 构建 sdist/wheel + GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build
      - name: Quality gate (full regression + coverage)
        run: |
          python -m pytest tests/ -q --tb=short --junitxml=reports/junit.xml \
            --cov=tcms --cov-report=term --cov-fail-under=97
      - name: Build package
        run: python -m build
      - name: Generate release notes
        run: |
          python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # 取最新版本段（到下一个 ## 前）
          m = re.search(r"## \[([^\]]+)\] - (.+?)\n(.*?)(?=\n## |\Z)", text, re.S)
          if not m:
              raise SystemExit("CHANGELOG 最新版本段缺失")
          pathlib.Path("release_notes.md").write_text(
              f"# v{m.group(1)} ({m.group(2)})\n\n{m.group(3).strip()}\n",
              encoding="utf-8",
          )
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
